# Builds the manual (Markdown -> static HTML + PDF) and deploys it over FTPS
# to manuals/<version>/<language>/ on every push. The exact same file is
# committed to the 4 language branches (v0.19_es, v0.19_en, v0.19_fr,
# v0.19_pt-BR) of this repo -- each branch holds one language at its root
# (see scripts/manual-site/, build.ts's own comment for why), so one build
# only ever touches its own language's subfolder on the remote, never the
# other 3.
#
# Secrets to set once on the repo (Settings -> Secrets and variables ->
# Actions; repo secrets are shared by every branch, no need to repeat them
# per branch): FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
name: Deploy manual

on:
  push:
    branches: ["v*"]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Branch name -> {version, language} ("v0.19_es" -> "0.19"/"es",
      # "v0.19_pt-BR" -> "0.19"/"pt-BR"). build-manual.ts derives the same
      # pair itself from GITHUB_REF_NAME for the build; this step only
      # exists to have them as separate values for the FTP destination path.
      - name: Derive version and language from the branch name
        id: branch
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+)_([a-zA-Z-]+)$ ]]; then
            language="${BASH_REMATCH[2]}"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "language=$language" >> "$GITHUB_OUTPUT"
            # Public URL folder differs from the internal language code
            # for Brazilian Portuguese: "pt-BR" everywhere else (UI
            # strings, PDF filename, translate.py) but just "pt" here.
            if [[ "$language" == "pt-BR" ]]; then
              echo "deploy_language=pt" >> "$GITHUB_OUTPUT"
            else
              echo "deploy_language=$language" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::error::Branch '$GITHUB_REF_NAME' does not match 'v<version>_<language>' (e.g. v0.19_es)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build the manual (HTML)
        run: npm run manual:build

      # Cache keyed by package-lock.json, which changes whenever the
      # Playwright version bumps -- without this every run re-downloads
      # Chromium.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (+ OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install OS deps for Playwright (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build the manual's PDF
        run: npm run manual:pdf

      - name: Verify the build before deploying
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s "dist/QGISRed-manual-${{ steps.branch.outputs.language }}.pdf"

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # `cmd:fail-exit` stops lftp at the first failing command; without it a
      # failed mirror can still exit 0, leaving a half-uploaded manual
      # published as if it were a success.
      - name: Deploy over FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: manuals/${{ steps.branch.outputs.version }}/${{ steps.branch.outputs.deploy_language }}/
        run: |
          set -euo pipefail
          lftp -e "
            set cmd:fail-exit true;
            set net:timeout 30;
            set net:max-retries 2;
            set net:reconnect-interval-base 5;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:ssl-protect-list true;
            set ssl:verify-certificate yes;
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
            mirror --reverse --delete --verbose --parallel=3 ./dist/ $REMOTE_DIR;
            bye
          "
